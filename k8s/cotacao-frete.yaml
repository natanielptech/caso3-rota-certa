apiVersion: apps/v1
kind: Deployment
metadata:
  name: cotacao-frete-service
spec:
  replicas: 4
  selector:
    matchLabels:
      app: cotacao-frete-service
  template:
    metadata:
      labels:
        app: cotacao-frete-service
    spec:
      containers:
        - name: cotacao-frete-service
          image: rotacerta/cotacao-frete-service:latest
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: TRANSVALE_URL
              value: http://transportadoras-stub:8083/v1/partners/transvale
            - name: RAPIDA_URL
              value: http://transportadoras-stub:8083/v1/partners/rapida
            - name: ECONOMICA_URL
              value: http://transportadoras-stub:8083/v1/partners/economica
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            failureThreshold: 30
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: cotacao-frete-service
spec:
  selector:
    app: cotacao-frete-service
  ports:
    - name: http
      port: 8081
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cotacao-frete-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cotacao-frete-service
  minReplicas: 4
  maxReplicas: 40
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
