server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

spring:
  application:
    name: cotacao-frete-service

rotacerta:
  carriers:
    timeout-ms: ${PARTNER_TIMEOUT_MS:800}
    urls:
      transvale: ${TRANSVALE_URL:http://localhost:8083/v1/partners/transvale}
      rapida: ${RAPIDA_URL:http://localhost:8083/v1/partners/rapida}
      economica: ${ECONOMICA_URL:http://localhost:8083/v1/partners/economica}

management:
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    propagation:
      type:
        - w3c
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
