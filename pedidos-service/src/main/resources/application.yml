server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

spring:
  application:
    name: pedidos-service

rotacerta:
  quote-service:
    url: ${QUOTE_SERVICE_URL:http://localhost:8081}
    timeout-ms: ${QUOTE_SERVICE_TIMEOUT_MS:1200}

management:
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    propagation:
      type:
        - w3c
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
